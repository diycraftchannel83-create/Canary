name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Firebase config restored from repository secret."
          else
            echo "Firebase config secret missing; app will show setup guidance instead of crashing."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Print CI debug keystore SHA-1 and SHA-256
        run: |
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            echo "ERROR: CI debug keystore not found at $DEBUG_KEYSTORE"
            find "$HOME" -name debug.keystore -type f 2>/dev/null || true
            exit 1
          fi
          keytool -list -v -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"
          echo "NOTE: This fingerprint belongs to the runner-generated debug keystore for this workflow run."

      - name: Run unit tests (retry transient Maven failures)
        run: |
          for attempt in 1 2 3; do
            echo "Unit test attempt $attempt/3"
            if gradle test --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Test failed; waiting ${delay}s before retry for transient dependency/rate-limit errors."
              sleep "$delay"
            fi
          done
          echo "Unit tests failed after 3 attempts."
          exit 1

      - name: Decode Android release keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "Release signing secrets incomplete; skipping release build."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/kenari-release-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/kenari-release-key.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEYSTORE_PATH: $RUNNER_TEMP/keystore/kenari-release-key.jks
        run: |
          if [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ ! -f "$ANDROID_KEYSTORE_PATH" ]; then
            echo "Release signing secrets or keystore unavailable; release build skipped."
            exit 0
          fi
          gradle assembleRelease bundleRelease --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kenari-Tasikmalaya-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release outputs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Kenari-Tasikmalaya-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
