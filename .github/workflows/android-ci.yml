name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Firebase config restored from repository secret."
          else
            echo "Firebase config secret missing; app will show setup guidance instead of crashing."
          fi

      - name: Restore persistent CI debug keystore
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}
          CI_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CI_DEBUG_KEYSTORE_PASSWORD }}
          CI_DEBUG_KEY_ALIAS: ${{ secrets.CI_DEBUG_KEY_ALIAS }}
          CI_DEBUG_KEY_PASSWORD: ${{ secrets.CI_DEBUG_KEY_PASSWORD }}
        run: |
          if [ -z "$CI_DEBUG_KEYSTORE_BASE64" ] || [ -z "$CI_DEBUG_KEYSTORE_PASSWORD" ] || [ -z "$CI_DEBUG_KEY_ALIAS" ] || [ -z "$CI_DEBUG_KEY_PASSWORD" ]; then
            echo "Persistent CI debug signing secrets missing; build will use runner debug keystore."
          else
            mkdir -p "$RUNNER_TEMP/ci-keystore"
            echo "$CI_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ci-keystore/canary-debug.keystore"
            echo "CI_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/ci-keystore/canary-debug.keystore" >> "$GITHUB_ENV"
            echo "CI_DEBUG_KEYSTORE_PASSWORD=$CI_DEBUG_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "CI_DEBUG_KEY_ALIAS=$CI_DEBUG_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "CI_DEBUG_KEY_PASSWORD=$CI_DEBUG_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK (retry transient Maven rate limits)
        run: |
          set -e
          for attempt in 1 2 3 4; do
            echo "Debug build attempt $attempt/4"
            if gradle assembleDebug --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 45))
              echo "Build failed; waiting ${delay}s before retry (Maven Central may be rate-limiting)."
              sleep "$delay"
            fi
          done
          echo "::error::Debug build failed after retries."
          exit 1

      - name: Print CI debug keystore SHA-1 and SHA-256
        env:
          CI_DEBUG_KEYSTORE_PATH: ${{ env.CI_DEBUG_KEYSTORE_PATH }}
          CI_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CI_DEBUG_KEYSTORE_PASSWORD }}
          CI_DEBUG_KEY_ALIAS: ${{ secrets.CI_DEBUG_KEY_ALIAS }}
        run: |
          if [ -n "$CI_DEBUG_KEYSTORE_PATH" ] && [ -f "$CI_DEBUG_KEYSTORE_PATH" ]; then
            keytool -list -v -keystore "$CI_DEBUG_KEYSTORE_PATH" -storepass "$CI_DEBUG_KEYSTORE_PASSWORD" -alias "$CI_DEBUG_KEY_ALIAS" | grep -E "SHA1:|SHA256:"
            echo "Fingerprint belongs to persistent CI debug signing certificate."
          else
            DEBUG_KEYSTORE="$(find "$HOME" -type f -name debug.keystore 2>/dev/null | head -n 1)"
            if [ -z "$DEBUG_KEYSTORE" ] || [ ! -f "$DEBUG_KEYSTORE" ]; then echo "ERROR: No debug keystore found."; exit 1; fi
            keytool -list -v -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"
            echo "WARNING: runner-generated debug keystore fingerprint; not stable."
          fi

      - name: Run unit tests (retry transient Maven failures)
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "Unit test attempt $attempt/3"
            if gradle test --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "Test failed; waiting ${delay}s before retry for transient dependency/rate-limit errors."
              sleep "$delay"
            fi
          done
          echo "Unit tests failed after 3 attempts."
          exit 1

      - name: Decode and validate Android release keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "::error::Release signing secrets are incomplete."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          KEYSTORE_FILE="$RUNNER_TEMP/keystore/kenari-release-key.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then echo "::error::Decoded release keystore is empty."; exit 1; fi
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "Release keystore decoded and validated."
          echo "Release signing certificate fingerprints:"
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E "SHA1:|SHA256:"

      - name: Build signed release APK and AAB
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore/kenari-release-key.jks
        run: |
          set -e
          if [ ! -f "$ANDROID_KEYSTORE_PATH" ]; then echo "::error::Release keystore file missing at configured path."; exit 1; fi
          gradle assembleRelease bundleRelease --stacktrace

      - name: Upload debug APK
        if: always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Kenari-Tasikmalaya-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14
      - name: Report debug APK unavailable
        if: always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') == ''
        run: echo "Debug APK was not generated. Check the Gradle build step above for the real failure."

      - name: Upload signed release outputs
        if: github.event_name != 'pull_request' && (hashFiles('app/build/outputs/apk/release/app-release.apk') != '' || hashFiles('app/build/outputs/bundle/release/app-release.aab') != '')
        uses: actions/upload-artifact@v4
        with:
          name: Kenari-Tasikmalaya-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 30
      - name: Report release build skipped
        if: github.event_name != 'pull_request' && hashFiles('app/build/outputs/apk/release/app-release.apk') == '' && hashFiles('app/build/outputs/bundle/release/app-release.aab') == ''
        run: echo "Release outputs absent. Check ANDROID_KEYSTORE_BASE64 and release signing secrets, or review earlier Gradle errors."
